*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;background:#b8a888;font-family:'Courier New',Courier,monospace;}

#device{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;

}
#ds-body{position:relative;display:flex;flex-direction:column;align-items:center;}

#top-casing{

  border-radius:18px 18px 5px 5px;padding:10px 12px 7px;
  box-shadow:0 -2px 0 #ede0c8,inset 0 2px 5px rgba(255,255,255,.6),inset 0 -1px 3px rgba(0,0,0,.12),0 4px 0 #a89880;
}
#top-screen-bezel{background:#111;border-radius:8px;padding:6px;box-shadow:inset 0 0 14px rgba(0,0,0,.9),0 0 0 1px #2a2a2a;}
#top-canvas-wrap{position:relative;overflow:hidden;border-radius:3px;}

#hinge{
  width:100%;height:13px;
  background:linear-gradient(180deg,#a89880 0%,#ccc0ac 45%,#a89880 100%);
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;z-index:10;

#hinge::before,#hinge::after{content:'';width:28px;height:10px;background:linear-gradient(180deg,#b8ac9c,#988c7c);border-radius:5px;box-shadow:inset 0 1px 2px rgba(255,255,255,.4),0 1px 2px rgba(0,0,0,.3);}

#bottom-casing{

#controls-row{width:100%;display:flex;align-items:center;justify-content:center;padding:0;gap:0;}
.timer-badge{font-size:15px;font-weight:bold;letter-spacing:.5px;padding:5px 9px;border-radius:7px;font-family:'Courier New',monospace;width:90px;text-align:center;flex-shrink:0;}

let SW = 0, SH = 0;
let UI_TIMER_FS = 16;
function updateUiTimerFont(){
  const el=document.getElementById('total-badge');
  if(!el)return;
  const v=parseInt(getComputedStyle(el).fontSize,10);
  if(Number.isFinite(v)&&v>0) UI_TIMER_FS=v;
}
function layout() {
  const vw=window.innerWidth;
  const vh=(window.visualViewport?window.visualViewport.height:window.innerHeight);
  const resH=13+78+36+62;
  const availH=vh-resH, availW=vw-40;
  const asp=4/3;
  let sh=Math.floor(availH/2), sw=Math.floor(sh*asp);
  if(sw>availW){sw=availW;sh=Math.floor(sw/asp);}
  SW=sw;SH=sh;
  [topCv,botCv].forEach(cv=>{cv.width=SW;cv.height=SH;});
  ['top-canvas-wrap','bottom-canvas-wrap'].forEach(id=>{
    const el=document.getElementById(id);
    el.style.width=SW+'px';el.style.height=SH+'px';
  });
  if(G) initPositions();
  updateUiTimerFont();
}

function brickW()  {return Math.max(44,Math.floor(SW*0.38));}
function brickX()  {return Math.floor(SW*0.53);}
function brickUW() {return Math.floor(brickW()/6);}
function groundY() {return SH-14;}
function rowH()    {return Math.max(5,Math.floor((groundY()-8)/11));}
function workerS() {return Math.max(1,Math.floor(SH/48));}
function monkeyS() {return Math.max(1,Math.floor(SH/48));}
function peelS()   {return Math.max(1,Math.floor(workerS()*18/36));}

function newGame(min) {
  return {
    mode:'setup',
    workSec:0, monkeySec:0, targetSec:min*60,
    brickTimer:0, bricks:0, rows:0, castles:0, brickPartW:0,

function initPositions(){
  G.workerX=G.workerTargetX=brickX()+brickW()*0.5;
  G.monkeyX=G.monkeyTargetX=SW*0.15;
  G.idleX=Math.floor(SW*0.5);
  G.idleTargetX=Math.floor(SW*0.5);
}

const AC=new(window.AudioContext||window.webkitAudioContext)();
function tone(f,tp,d,v,t0=0){
  if(muted)return;
  try{
    AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    o.connect(g);g.connect(AC.destination);
    o.type=tp;o.frequency.value=f;
    const t=AC.currentTime+t0;
    g.gain.setValueAtTime(v,t);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.start(t);o.stop(t+d+0.02);
  }catch(e){}
}
function snd(name){
  if(muted)return;AC.resume();
  const T=(f,tp,d,v,t)=>tone(f,tp,d,v,t);
  switch(name){
    case 'click':  T(900,'square',.035,.16);T(1100,'square',.035,.12,.03);break;
    case 'start':  T(440,'square',.07,.20);T(550,'square',.07,.20,.08);T(660,'square',.12,.20,.16);break;
    case 'switch': T(880,'square',.07,.20);T(330,'square',.08,.15,.06);break;
    case 'brick':  T(260,'square',.04,.18);T(180,'sawtooth',.06,.12,.03);break;
    case 'peel':   T(140,'sawtooth',.14,.20);T(90,'sawtooth',.10,.14,.10);break;
    case 'sweep':  T(520,'sine',.10,.14);T(660,'sine',.08,.11,.08);break;
    case 'row':    T(523,'square',.10,.20);T(659,'square',.10,.20,.10);T(784,'square',.14,.20,.20);break;
    case 'castle': [523,659,784,880,1047].forEach((f,i)=>T(f,'square',.18,.22,i*.09));
                   setTimeout(()=>[784,880,1047].forEach((f,i)=>T(f,'square',.22,.18,i*.07)),560);break;
    case 'win':    [523,659,784,1047,1319].forEach((f,i)=>T(f,'square',.25,.20,i*.11));break;
  }
}

document.getElementById('mute-btn').onclick=()=>{muted=!muted;document.getElementById('mute-btn').textContent=muted?'🔇 MUTE':'🔊 SOUND';if(!muted)snd('click');};
document.getElementById('reset-btn').onclick=()=>{snd('click');resetGame();};
document.getElementById('switch-btn').onclick=()=>switchMode();
document.getElementById('go-btn').onclick=()=>startGame();
document.getElementById('pause-btn').onclick=()=>{snd('click');togglePause();};
document.querySelectorAll('.time-opt').forEach(b=>{
  if(!b.dataset.min)return;
  b.onclick=()=>{
    AC.resume();snd('click');
    document.querySelectorAll('.time-opt').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    selectedMin=+b.dataset.min;
    if(G) G.targetSec=selectedMin*60;
    const el=document.getElementById('total-badge');
    if(el) el.textContent=`⏳ ${fmtRemain(selectedMin*60)}`;
  };
});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(G?.mode==='work'||G?.mode==='monkey')switchMode();}
  if(e.code==='Enter'&&G?.mode==='setup')startGame();
  if(e.code==='KeyR')resetGame();
  if(e.code==='KeyP')togglePause();
});
[topCv,botCv].forEach(cv=>{
  cv.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(G?.mode==='setup'){ tapMonkey(e.touches[0].clientX,e.touches[0].clientY); return; }
    if(G?.mode==='work'||G?.mode==='monkey')switchMode();
  },{passive:false});
});
topCv.addEventListener('click',e=>{
  if(G?.mode==='setup'){ tapMonkey(e.clientX,e.clientY); }
});

function tapMonkey(cx,cy){
  const rect=topCv.getBoundingClientRect();
  const scaleX=SW/rect.width, scaleY=SH/rect.height;
  const lx=(cx-rect.left)*scaleX;
  const ly=(cy-rect.top)*scaleY;
  const ms=monkeyS();
  const mx=G.idleX, my=SH-12-14*ms;
  if(lx>mx-2&&lx<mx+14*ms&&ly>my-2&&ly<my+14*ms){
    G.likeAnim=1.8;
    for(let i=0;i<4;i++){
      G.hearts.push({x:mx+ms*7+(Math.random()-0.5)*ms*8,y:my+ms*3,a:1});
    }
    snd('row');
  }
}

function switchMode(){
  if(!G||G.mode==='setup'||G.mode==='ended'||paused)return;
  AC.resume();G.mode=G.mode==='work'?'monkey':'work';
  if(G.mode==='work'){G.zz=[];G.zzTimer=0;G.hammerFlash=0;}
  snd('switch');if(navigator.vibrate)navigator.vibrate([25,8,8]);
}
function startGame(){
  if(!G||G.mode!=='setup')return;
  AC.resume();snd('start');
  document.getElementById('setup-ov').classList.add('hidden');
  initPositions();G.mode='work';
}
function resetGame(){
  paused=false;
  document.getElementById('pause-btn').textContent='⏸ PAUSE';
  document.getElementById('pause-btn').classList.remove('paused');
  AC.resume();
  document.getElementById('end-ov').classList.add('hidden');
  document.getElementById('setup-ov').classList.remove('hidden');
  G=newGame(selectedMin);layout();
}
function togglePause(){
  if(!G||G.mode==='setup'||G.mode==='ended')return;
  paused=!paused;
  const btn=document.getElementById('pause-btn');
  btn.textContent=paused?'▶ RESUME':'⏸ PAUSE';
  btn.classList.toggle('paused',paused);
}

function px(ctx,x,y,w,h,c){
  ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.max(1,w),Math.max(1,h));
}

// ──────────────────────────────────────────────────────────────
//  JUNGLE BACKGROUND (top screen)
// ──────────────────────────────────────────────────────────────

function pixDome(cx,baseY,rw,rh,col,hiCol,shadowCol){
  if(rw<3||rh<3) return;
  const ctx2=topCtx;
  const D=3;
  for(let row=0;row<rh;row+=D){
    const phase=Math.sin(Math.min(1,row/rh/0.55)*Math.PI);
    const w=Math.max(D*2,Math.floor(rw*phase));
    const lx=cx-Math.floor(w/2), y=baseY-rh+row;
    const isHi=row<rh*0.25, isShadow=row>rh*0.72&&!isHi;
    ctx2.fillStyle=isShadow?shadowCol:(isHi?hiCol:col);
    ctx2.fillRect(lx,y,w,D);
    if(w>6){ctx2.fillStyle=hiCol;ctx2.fillRect(lx,y,3,D);}
  }
}

function pixDomeCtx(ctx,cx,baseY,rw,rh,col,hiCol,shadowCol){
  if(rw<2||rh<2) return;
  for(let row=0;row<rh;row++){
    const phase=Math.sin(Math.min(1,row/rh/0.55)*Math.PI);
    const w=Math.max(2,Math.floor(rw*phase));
    const lx=cx-Math.floor(w/2), y=baseY-rh+row;
    const isHi=row<rh*0.25, isShadow=row>rh*0.72&&!isHi;
    ctx.fillStyle=isShadow?shadowCol:(isHi?hiCol:col);
    ctx.fillRect(lx,y,w,1);
    if(w>4){ctx.fillStyle=hiCol;ctx.fillRect(lx,y,2,1);}
  }
}

let _jCache=null, _jCacheW=0, _jCacheH=0;

function buildJungleCache(W,H){
  const safeW=Math.max(1,W), safeH=Math.max(1,H);
  const oc=(typeof OffscreenCanvas!=='undefined')
    ?new OffscreenCanvas(safeW,safeH)
    :(()=>{const c=document.createElement('canvas');c.width=safeW;c.height=safeH;return c;})();
  const c=oc.getContext('2d');
  const D=3;
  const p=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(Math.round(x),Math.round(y),Math.max(D,w),Math.max(D,h));};

  [[0,Math.floor(H*0.18),'#071018'],[Math.floor(H*0.18),Math.floor(H*0.34),'#0b1822'],
   [Math.floor(H*0.34),Math.floor(H*0.50),'#0e2020'],[Math.floor(H*0.50),H,'#122818'],
  ].forEach(([y1,y2,col])=>{c.fillStyle=col;c.fillRect(0,y1,W,y2-y1);});

  const mX=Math.floor(W*0.80),mY=Math.floor(H*0.11),mr=Math.max(6,Math.floor(H/18));
  for(let dy=-mr;dy<=mr;dy++) for(let dx=-mr;dx<=mr;dx++)
    if(dx*dx+dy*dy<=mr*mr){
      const hi=(dx<0&&dy<0)||dx<-mr*0.3;
      c.fillStyle=hi?'#e0f8a0':'#b8d878'; c.fillRect(mX+dx,mY+dy,1,1);
    }
  const sOff=Math.floor(mr*0.38);
  for(let dy=-mr;dy<=mr;dy++) for(let dx=-mr;dx<=mr;dx++)
    if((dx-sOff)*(dx-sOff)+dy*dy<=(mr*0.84)*(mr*0.84)){c.fillStyle='#0b1822';c.fillRect(mX+dx,mY+dy,1,1);}

  [[.06,.06],[.16,.10],[.25,.04],[.38,.09],[.50,.05],[.62,.11],[.73,.03],[.90,.08]].forEach(([fx,fy])=>
    p(Math.floor(fx*W),Math.floor(fy*H*0.72),D,D,'#2a5a30')
  );

  p(0,H-12,W,12,'#1e5028'); p(0,H-12,W,2,'#2a7038');
  return oc;
}

function drawJungle(ctx,W,H,scroll){
  if(W<1||H<1) return;
  if(!_jCache||_jCacheW!==W||_jCacheH!==H){
    _jCache=buildJungleCache(W,H);
    _jCacheW=W; _jCacheH=H;
  }
  ctx.drawImage(_jCache,0,0);

  const sc=Math.floor(scroll);
  const D=3;
  const p=(x,y,w,h,col)=>px(ctx,x,y,Math.max(D,w),Math.max(D,h),col);

  // Twinkling stars
  [[.06,.06],[.16,.10],[.25,.04],[.38,.09],[.50,.05],[.62,.11],[.73,.03],[.90,.08]].forEach(([fx,fy],i)=>{
    const sx=((Math.floor(fx*W)+Math.floor(sc*0.12)+i*23)%W);
    const sy=Math.floor(fy*H*0.72);
    const bright=(G.fc+i*11)%34<17;
    p(sx,sy,D,D,bright?'#88c868':'#3a6a38');
    if(bright) p(sx+D,sy,D,D,'#b8e898');
  });

  // Far silhouette (3 layers)
  const farBot=H-14;
  [
    {speed:0.05,col:'#08120a',hi:'#0d1a0e',baseH:0.30,ampH:0.14,f:[2.7,5.9,12.1,27.3,53.7],ph:[1.3,0.8,2.1,0.6,1.7],windAmp:1.2,windSpd:0.011,windPh:0.0},
    {speed:0.09,col:'#0c1a0d',hi:'#112010',baseH:0.25,ampH:0.12,f:[2.3,5.3,11.7,24.1,49.3],ph:[0.9,1.4,0.7,1.8,0.4],windAmp:1.5,windSpd:0.015,windPh:1.1},
    {speed:0.13,col:'#101e11',hi:'#162614',baseH:0.21,ampH:0.10,f:[3.1,6.7,13.3,29.1,57.1],ph:[1.7,0.5,2.3,0.8,1.2],windAmp:1.8,windSpd:0.019,windPh:2.3},
  ].forEach((L,li)=>{
    const offX=Math.floor(sc*L.speed);
    const wts=[0.35,0.25,0.20,0.12,0.08];
    const windPhase=G.fc*L.windSpd+L.windPh;
    for(let x=0;x<W;x+=D){
      const xn=(x+offX)/W;
      let v=0; L.f.forEach((f,fi)=>v+=Math.sin(xn*Math.PI*f+L.ph[fi])*wts[fi]);
      const norm=Math.max(0,Math.min(1,0.5+v*0.45));
      const windOff=Math.round(Math.sin(windPhase+xn*6.2+li)*L.windAmp);
      const colH=Math.floor(H*(L.baseH+norm*L.ampH))+windOff;

  // Mid-ground trees – 3 depth layers for parallax
  const mgGnd=H-14;

  // ── BACK layer: small, dark, slow scroll ──
  [
    {ox:20,  trH:0.28,trW:8, seed:23,leanX:2 },
    {ox:110, trH:0.25,trW:7, seed:31,leanX:-3},
    {ox:210, trH:0.30,trW:9, seed:41,leanX:3 },
    {ox:310, trH:0.27,trW:8, seed:53,leanX:-2},
    {ox:400, trH:0.26,trW:7, seed:61,leanX:2 },
    {ox:480, trH:0.29,trW:8, seed:71,leanX:-3},
    {ox:560, trH:0.24,trW:6, seed:83,leanX:2 },
  ].forEach((t,ti)=>{
    const scrollX=Math.floor(sc*0.14);

    const trH=Math.floor(H*t.trH), cx=tx+Math.floor(t.trW/2), s=t.seed, top=mgGnd-trH;
    // Dark trunk (far = darker)
    for(let ty=0;ty<trH;ty+=D){
      const frac=ty/trH;
      const tw2=Math.max(D,Math.round(t.trW*(1-frac*0.25)));
      const lx=cx+Math.round(t.leanX*frac)-Math.floor(tw2/2);
      p(lx,top+ty,tw2,D,(ty%8<4)?'#1a2c0e':'#121e08');

    const pal=[['#2a7030','#38883a','#144020'],['#226028','#2c7632','#103418'],

    const blobWindAmp=1.8+((ti*7)%3)*0.4;

    // Trunk top sway (top 20% of trunk sways with canopy)

      const fruitSway=Math.round(Math.sin(blobWindPhase+ti*0.7)*blobWindAmp*0.5);
      for(let fi=0;fi<4;fi++){p(cCX+fSide+(fi%2)*6+fruitSway,fY+Math.floor(fi/2)*6,D+2,D+2,fCol);}

  });

  // ── FRONT layer: large, darker, slower scroll ──

    [[(s%5-2)*10,-Math.floor(BIG*0.10),BIG,Math.floor(BIG*0.70),0,0.0],

     [-Math.floor(BIG*0.30)+(s%4-2)*6,Math.floor(BIG*0.32),Math.floor(MED*0.92),Math.floor(MED*0.68),2,0.35],
     [Math.floor(BIG*0.28)+(s%3-1)*7,Math.floor(BIG*0.28),Math.floor(MED*0.85),Math.floor(MED*0.62),2,0.35],
     [(s%9-4)*9,Math.floor(BIG*0.48),Math.floor(MED*0.78),Math.floor(MED*0.55),3,0.50],
    ].forEach(([dx,dy,rw,rh,pi,frac])=>{
      if(rw<D*2||rh<D) return;
      const[col,hi,sh]=palFront[pi%palFront.length];
      pixDome(cCX+dx+fSway(frac),cY+dy+fBob,rw,rh,col,hi,sh);
    });
    // Leaf tips (darker)
    const lfPhase=G.fc*0.016+ti*1.2;
    [[(s%9-4)*14,-Math.floor(BIG*0.08)],[-Math.floor(BIG*0.55),Math.floor(BIG*0.02)],[Math.floor(BIG*0.50),Math.floor(BIG*0.05)]].forEach(([dx,dy])=>{
      const ls=Math.round(Math.sin(lfPhase+dx*0.01)*fwAmp*0.7);
      p(cCX+dx+ls,cY+dy,D*3,D,'#40a048');p(cCX+dx+ls,cY+dy+D,D*2,D,'#306030');
    });
  });

  // Ground strip
  px(ctx,0,H-12,W,12,JNG.gnd);px(ctx,0,H-12,W,2,JNG.gndH);

  // Vines hanging from top
  for(let i=0;i<12;i++){
    const vx=((i*35+Math.floor(sc*0.55)+i*17)%W);
    const vlen=Math.floor(H*0.10)+((i*29)%Math.floor(H*0.14));
    const sway1=((i%5)-2)*4, sway2=((i%3)-1)*5;
    const windAmp=3+((i*3)%4);
    const windPhase=G.fc*0.025+i*0.8;
    let prevX=vx;
    for(let seg=0;seg<vlen;seg+=3){
      const t2=seg/vlen;
      const windOff=Math.round(Math.sin(windPhase)*windAmp*t2*t2);
      const curX=vx+Math.floor(sway1*Math.sin(t2*Math.PI)+sway2*Math.sin(t2*Math.PI*2))+windOff;
      px(ctx,curX,seg,1+(i%2),3,'#1c4a18');
      if(curX!==prevX) px(ctx,Math.min(curX,prevX),seg,Math.abs(curX-prevX)+1,1,'#1c4a18');
      if(seg>0&&seg%(Math.floor(vlen/3))<3){
        const lsize=3+((i+seg)%3);
        const leafSway=Math.round(Math.sin(windPhase+t2)*windAmp*0.7);
        pixDome(curX+leafSway+((i%2)?lsize:-lsize),seg,lsize*2+2,lsize,'#286828','#3a8838','#164018');
      }
      prevX=curX;
    }
  }

  // Foreground undergrowth
  {
    const baseY=H-14;
    function pixFrond(bx,by,angle,len,leafW,col,hiCol){
      const cos=Math.cos(angle), sin=Math.sin(angle);
      for(let d=2;d<len;d+=2){
        const fx=Math.round(bx+cos*d), fy=Math.round(by+sin*d);
        const t2=d/len;
        const w=Math.max(1,Math.round(leafW*(1-t2*t2)));
        const c=t2<0.25?hiCol:col;
        px(ctx,fx-Math.floor(w/2),fy-Math.floor(w/2),w,w,c);
      }
    }
    const clusterDefs=[
      {type:'palm',size:1.0},{type:'fern',size:0.8},
      {type:'broad',size:1.1},{type:'palm',size:0.9},
      {type:'fern',size:1.0},{type:'broad',size:0.85},
      {type:'palm',size:1.1},{type:'fern',size:0.9},
      {type:'broad',size:1.0},{type:'palm',size:0.85},
      {type:'fern',size:1.2},{type:'broad',size:0.9},
    ];
    for(let i=0;i<12;i++){
      const bx=((i*34+Math.floor(sc*0.9)+i*11)%(W+16))-4;
      const def=clusterDefs[i%clusterDefs.length];
      const sz=def.size;
      const windPhase=G.fc*0.03+i*0.9;
      const sway=Math.round(Math.sin(windPhase)*1.5);
      const swayTip=Math.round(Math.sin(windPhase+0.4)*2.5);

      if(def.type==='palm'){
        const stalkH=Math.floor(H*0.10*sz)+((i*7)%Math.floor(H*0.04));
        const topY=baseY-stalkH;
        for(let ty=0;ty<stalkH;ty++){
          const col=(ty%5<2)?'#2a4818':'#1e3810';
          const frac=ty/stalkH;
          px(ctx,bx+Math.round(sway*frac*frac),baseY-ty,2,1,col);
        }
        const frondLen=Math.floor(stalkH*0.75);
        const windAng=sway*0.04;
        const angles=[-1.8,-1.4,-1.1,-0.75,-0.4];
        const stalkTop=bx+sway;
        angles.forEach((ang,fi)=>{
          const fc2=fi===2?'#44a040':'#2a7030';
          const fhi=fi===2?'#58c050':'#38883a';
          pixFrond(stalkTop,topY,ang+windAng,frondLen,3+(fi===2?2:1),fc2,fhi);
        });
        [-1.6,-1.2,-0.8].forEach((ang)=>{
          pixFrond(stalkTop+1,topY,-ang+windAng,Math.floor(frondLen*0.85),2,'#286828','#34783a');
        });
      } else if(def.type==='fern'){
        const stemH=Math.floor(H*0.07*sz)+((i*5)%Math.floor(H*0.03));
        const topY=baseY-stemH;
        for(let ty=0;ty<stemH;ty++){
          const frac=ty/stemH;
          px(ctx,bx+Math.round(sway*frac),topY+ty,2,1,(ty%5<2)?'#2a4818':'#1e3a10');
        }
        const leafCount=Math.floor(stemH/4);
        for(let li2=0;li2<leafCount;li2++){
          const ly=topY+li2*4+2;
          const side=li2%2===0?-1:1;
          const llen=Math.floor(stemH*0.5*(1-li2/leafCount))+4;
          const leafSway=Math.round(sway*(li2/leafCount));
          pixFrond(bx+leafSway+(side>0?2:0),ly,side*(Math.PI*0.4-li2*0.03),llen,2,'#2a6828','#3a8838');
        }
      } else {
        const leafH=Math.floor(H*0.09*sz)+((i*9)%Math.floor(H*0.03));
        const leafW2=Math.floor(leafH*0.55);
        const topY=baseY-leafH;
        pixDome(bx+sway,baseY,leafW2*2,leafH,'#246828','#30843a','#143618');
        px(ctx,bx+sway,topY,2,leafH,'#3a9040');
        px(ctx,bx+swayTip-1,topY-2,4,3,'#40a848');
        px(ctx,bx-leafW2+4,baseY-3,leafW2*2-8,3,'#0e2010');
      }
    }
    // Grass tufts
    for(let i=0;i<22;i++){
      const gx=((i*18+Math.floor(sc*1.1)+i*5)%W);
      const gh=4+((i*3)%5);
      const sway=Math.round(Math.sin(G.fc*0.05+i*0.7)*1.5);
      px(ctx,gx+sway,  baseY-gh,  1,gh,  '#2a7030');
      px(ctx,gx+sway+2,baseY-gh-2,1,gh+2,'#30883a');
      px(ctx,gx+sway+4,baseY-gh+1,1,gh-1,'#246028');
      px(ctx,gx,       baseY-2,   5,2,   '#142e10');
    }
  }

  // Ground strip (final)
  px(ctx,0,H-12,W,12,JNG.gnd);px(ctx,0,H-12,W,2,JNG.gndH);
  for(let i=0;i<16;i++){
    const gx=((i*22+Math.floor(sc*1.0)+i*7)%W);
    px(ctx,gx,H-13,2,3,'#2a7030');px(ctx,gx+3,H-14,1,4,'#1e5828');
  }
}

// ──────────────────────────────────────────────────────────────
//  CITY BACKGROUND (bottom screen)
// ──────────────────────────────────────────────────────────────
function drawCity(ctx,W,H,scroll){
  {
    const BAND=4;
    const bands=Math.ceil(H/BAND);
    for(let bi=0;bi<bands;bi++){
      const t=bi/bands;
      const e=Math.pow(t,1.6);
      const r =Math.round(2  + e*36);
      const g2=Math.round(5  + e*50);
      const b =Math.round(16 + e*110);
      ctx.fillStyle=`rgb(${r},${g2},${b})`;
      ctx.fillRect(0,bi*BAND,W,Math.min(BAND,H-bi*BAND));
    }
    const glowStart=Math.floor(H*0.65);
    for(let y=glowStart;y<H;y+=BAND){
      const t=(y-glowStart)/(H-glowStart);
      ctx.globalAlpha=t*0.20;
      ctx.fillStyle='#2848c0';
      ctx.fillRect(0,y,W,Math.min(BAND,H-y));
    }
    ctx.globalAlpha=1;
  }

  const mX=Math.floor(W*0.82), mY=Math.floor(H*0.12);
  const mr=Math.max(4,Math.floor(H/22));
  for(let dy=-mr;dy<=mr;dy++) for(let dx=-mr;dx<=mr;dx++){
    if(dx*dx+dy*dy<=mr*mr){
      const dist=Math.sqrt(dx*dx+dy*dy)/mr;
      const bright=Math.round(220+Math.floor((1-dist*dist)*30));
      ctx.fillStyle=`rgb(${bright},${bright+5},${bright+10})`;
      ctx.fillRect(mX+dx,mY+dy,1,1);
    }
  }

  const glowLayers=[
    {r:mr*1.6, a:0.18, c:'#c8ddf8'},
    {r:mr*2.2, a:0.10, c:'#b0cce8'},
    {r:mr*3.0, a:0.06, c:'#90b0d8'},
    {r:mr*4.0, a:0.03, c:'#7090c0'},
  ];
  glowLayers.forEach(L=>{
    for(let dy=-L.r;dy<=L.r;dy+=2) for(let dx=-L.r;dx<=L.r;dx+=2){
      const d2=dx*dx+dy*dy;
      if(d2<=L.r*L.r && d2>mr*mr){
        ctx.globalAlpha=L.a*(1-Math.sqrt(d2)/(L.r*1.2));
        ctx.fillStyle=L.c;
        ctx.fillRect(mX+dx,mY+dy,2,2);
      }
    }
  });
  ctx.globalAlpha=1;

  [
    [.06,.04],[.14,.09],[.22,.03],[.30,.07],[.38,.02],
    [.46,.06],[.54,.03],[.62,.08],[.70,.02],[.78,.06],
    [.86,.03],[.93,.07],[.10,.13],[.25,.12],[.40,.15],
    [.55,.11],[.68,.14],[.80,.12],[.92,.16],[.35,.18],
    [.50,.20],[.65,.17],[.20,.22],[.75,.19],[.88,.22],
  ].forEach(([fx,fy],i)=>{
    const sx=Math.floor(fx*W);
    const sy=Math.floor(fy*H*0.72);
    const bright=(G.fc+i*17)%80<40;
    px(ctx,sx,sy,1,1,bright?'#c8d8e8':'#3a4a5a');
    if(bright) px(ctx,sx+1,sy,1,1,'#e0ecf8');
  });

  const farW=[30,22,28,35,20,40,25,32,18,38];
  const farH=[0.38,0.28,0.35,0.45,0.25,0.50,0.32,0.40,0.22,0.48];
  for(let i=0;i<10;i++){
    const bx=((i*50+scroll*0.1)%(W+50))-10;
    const bh=Math.floor(H*farH[i]);
    const bw=farW[i];
    px(ctx,bx,H-14-bh,bw,bh,CTY.bld1);
    px(ctx,bx,H-14-bh,3,bh,CTY.bld1H);
    for(let wy2=4;wy2<bh-4;wy2+=7){
      for(let wx2=4;wx2<bw-4;wx2+=7){
        const key=i+'_'+wx2+'_'+wy2;
        if(windowCache[key]===undefined){ windowCache[key]=Math.random()>0.55; }
        const on=windowCache[key];
        const farWin = on ? '#c8b36a' : CTY.winOff;
        px(ctx,bx+wx2,H-14-bh+wy2,2,2,farWin);
      }
    }
  }

  const midW=[22,18,26,30,16,24,20,28];
  const midH=[0.42,0.32,0.48,0.55,0.28,0.44,0.36,0.50];
  for(let i=0;i<8;i++){
    const bx=((i*62+scroll*0.25+15)%(W+60))-10;
    const bh=Math.floor(H*midH[i]);
    const bw=midW[i];
    px(ctx,bx,H-14-bh,bw,bh,CTY.bld2);
    px(ctx,bx,H-14-bh,2,bh,CTY.bld2H);
    for(let wy2=3;wy2<bh-3;wy2+=8){
      for(let wx2=3;wx2<bw-3;wx2+=8){
        const key='mid_'+i+'_'+wx2+'_'+wy2;
        if(windowCache[key]===undefined){ windowCache[key]=Math.random()>0.45; }
        const on=windowCache[key];
        px(ctx,bx+wx2,H-14-bh+wy2,5,5,on?CTY.win:CTY.winOff);
      }
    }
  }

  {
    const hwT=Math.floor(H*0.86);
    const signs=[
      {bx:Math.floor(W*0.05), bldW:28, bldH:22, signW:22, signH:10, txt:'BAR',   col:'#ff2060', type:'neon'},
      {bx:Math.floor(W*0.35), bldW:36, bldH:18, signW:30, signH:12, txt:'CAFE',  col:'#00e8ff', type:'lit' },
      {bx:Math.floor(W*0.62), bldW:44, bldH:20, signW:38, signH:14, txt:'HOTEL', col:'#a020ff', type:'lit' },
      {bx:Math.floor(W*0.82), bldW:30, bldH:16, signW:24, signH:10, txt:'24H',   col:'#ff8800', type:'neon'},
    ];
    signs.forEach((s,si)=>{
      const bTop=hwT-s.bldH;
      const bFullH=H-bTop;
      px(ctx,s.bx,bTop,s.bldW,bFullH,'#1c1c28');
      px(ctx,s.bx,bTop,s.bldW,2,'#282838');
      px(ctx,s.bx,bTop,2,bFullH,'#282838');
      px(ctx,s.bx+s.bldW-2,bTop,2,bFullH,'#101018');
      for(let wy=bTop+4;wy<hwT-4;wy+=6){
        for(let wx=s.bx+4;wx<s.bx+s.bldW-4;wx+=7){
          const wlit=(si*7+Math.floor(wy/6)+Math.floor(wx/7))%4!==0;
          px(ctx,wx,wy,4,3,wlit?'#2a3040':'#0e0e18');
        }
      }
      px(ctx,s.bx,hwT+8,s.bldW,H-hwT-8,'#141420');
      px(ctx,s.bx,hwT+8,2,H-hwT-8,'#1e1e2c');
      const sx=s.bx+Math.floor((s.bldW-s.signW)/2);
      const sy=bTop-s.signH-1;
      let bright=1.0;
      if(s.type==='neon'){
        const phase=Math.sin(G.fc*0.09+si*2.3);
        const stutter=(Math.floor(G.fc/7)+si*17)%83<3;
        bright=stutter?0.08:(0.55+phase*0.12);
      }
      if(s.type==='neon'){
        px(ctx,sx-1,sy-1,s.signW+2,s.signH+2,'#101010');
        ctx.globalAlpha=bright*0.22;
        px(ctx,sx-3,sy-2,s.signW+6,s.signH+4,s.col);
        ctx.globalAlpha=1;
        ctx.globalAlpha=bright;
        px(ctx,sx,sy,s.signW,s.signH,s.col);
        ctx.globalAlpha=bright*0.6;
        px(ctx,sx,sy,s.signW,1,'#ffffff');
        px(ctx,sx,sy,1,s.signH,'#ffffff');
        ctx.globalAlpha=1;
      } else {
        px(ctx,sx-1,sy-1,s.signW+2,s.signH+2,'#181818');
        px(ctx,sx,sy,s.signW,s.signH,'#d8d8e0');
        px(ctx,sx,sy,s.signW,1,'#ffffff');
        px(ctx,sx,sy,1,s.signH,'#e8e8f0');
        px(ctx,sx+s.signW-1,sy,1,s.signH,'#a0a0b0');
        ctx.globalAlpha=0.10;
        px(ctx,sx-2,sy+s.signH,s.signW+4,4,s.col);
        ctx.globalAlpha=1;
      }
      const txtCol=s.type==='neon'?'#ffffff':s.col;
      ctx.fillStyle=txtCol;
      ctx.globalAlpha=s.type==='neon'?bright:1;
      ctx.font=`bold 5px 'Courier New'`;
      ctx.textAlign='center';
      ctx.fillText(s.txt, sx+s.signW/2, sy+s.signH-2);
      ctx.textAlign='left';
      ctx.globalAlpha=1;
      px(ctx,sx+2,bTop,1,sy-bTop+s.signH+1,'#303040');
      px(ctx,sx+s.signW-3,bTop,1,sy-bTop+s.signH+1,'#303040');
    });
  }

  const hwTop=Math.floor(H*0.86);
  const hwH=5;
  for(let pilX=15;pilX<W;pilX+=50){
    px(ctx,pilX,hwTop+hwH,2,H-hwTop-hwH,'#252530');
  }
  px(ctx,0,hwTop,W,hwH,'#181820');
  px(ctx,0,hwTop,W,1,'#252535');
  for(let dx=0;dx<W;dx+=16) px(ctx,dx,hwTop+2,9,1,'#202030');
  px(ctx,0,hwTop-2,W,2,'#383848');

  for(let i=0;i<6;i++){
    const lx=Math.floor(i*W/5.5)+12;
    const poleH=10;
    px(ctx,lx,hwTop-2-poleH,1,poleH,'#404050');
    px(ctx,lx-1,hwTop-2-poleH-2,3,2,'#f8a820');
    ctx.globalAlpha=0.18;
    px(ctx,lx-4,hwTop-2-poleH-4,9,6,'#f8c840');
    ctx.globalAlpha=1;
  }

  {
    const sx=Math.floor(W*0.68);
    const sy=hwTop-18;
    const sw=28, sh=10;
    px(ctx,sx,sy,sw,sh,'#1a5c28');
    px(ctx,sx,sy,sw,1,'#2a7838');
    px(ctx,sx,sy,1,sh,'#2a7838');
    px(ctx,sx+sw-1,sy,1,sh,'#0e3018');
    px(ctx,sx+Math.floor(sw/2),sy+sh,2,8,'#404050');
    ctx.fillStyle='#e8f8e0';
    ctx.font=`bold 5px 'Courier New'`;
    ctx.textAlign='center';
    ctx.fillText('EXIT',sx+Math.floor(sw/2),sy+7);
    ctx.textAlign='left';
  }
  px(ctx,0,hwTop+hwH,W,2,'#0a0a12');

  if(G.cars){
    G.cars.forEach(c=>{
      const cx=Math.round(c.x);
      const cy=hwTop+1;
      if(c.isBike){
        px(ctx,cx,cy,3,2,c.col);
        px(ctx,cx+1,cy-1,1,1,'#c8c8c8');
        if(c.spd>0) px(ctx,cx+2,cy+1,1,1,'#ffffc0');
        else         px(ctx,cx,cy+1,1,1,'#ff6060');
      } else {
        px(ctx,cx,cy,6,3,c.col);
        px(ctx,cx+1,cy-1,4,2,'#8ab0c8');
        if(c.spd>0) px(ctx,cx+5,cy+1,1,1,'#ffffc0');
        else         px(ctx,cx,cy+1,1,1,'#ff6060');
      }
    });
  }

  const avBuildings=[
    {fx:3, bwArr:farW, bhArr:farH},
    {fx:5, bwArr:farW, bhArr:farH},
    {fx:7, bwArr:farW, bhArr:farH},
  ];
  avBuildings.forEach(({fx,bwArr,bhArr})=>{
    const bw=bwArr[fx], bh=Math.floor(H*bhArr[fx]);
    const bx=((fx*50)%(W+50))-10 + Math.floor(bw/2);
    const by=H-14-bh-2;
    px(ctx,bx,by,2,2,'#dd1010');
    ctx.globalAlpha=0.25;
    px(ctx,bx-1,by-1,4,4,'#ff2020');
    ctx.globalAlpha=1;
  });
}

// ──────────────────────────────────────────────────────────────
//  SPRITES
// ──────────────────────────────────────────────────────────────
function drawMonkey(ctx,ox,oy,s,mode,fr,jOff=0){
  const f=fr&1;
  const tEat=(mode==='eat')?Math.max(0,Math.min(0.999,G.bananaEat||0)):0;
  const TAU=Math.PI*2;
  if(mode==='eat'){
    const bounce=Math.sin(tEat*TAU*2.6);
    const sway=Math.sin(tEat*TAU*1.3+0.7);
    ox+=Math.round(sway*s*0.6);
    oy+=Math.round(bounce*s*0.7);
  }
  const by=oy+jOff;
  const ease=t=>t<=0?0:t>=1?1:(t*t*(3-2*t));
  const headLead=(mode==='eat')?Math.sin(tEat*TAU*2.6+0.9):0;
  const headSway=(mode==='eat')?Math.sin(tEat*TAU*1.3+1.4):0;
  const hdx=(mode==='eat')?Math.round(headSway*s*0.35):0;
  const hdy=(mode==='eat')?Math.round(headLead*s*0.35):0;
  const bodyX=ox, bodyY=by;
  const headX=ox+hdx, headY=by+hdy;
  const wag=(mode==='eat')?Math.round(Math.sin(tEat*TAU*4.2)*s*1.1):0;
  [[8,6],[9,5],[10,5],[11,6],[12,7],[12,8],[11,9],[10,10],[9,11]].forEach(([tx,ty])=>{
    px(ctx,bodyX+tx*s+wag,bodyY+ty*s,s,s,G4.mFur);
  });
  px(ctx,bodyX+10*s+wag,bodyY+5*s,2*s,Math.ceil(s*.7),G4.mFurH);
  px(ctx,bodyX+2*s,bodyY+8*s,9*s,4*s,G4.mFur);
  px(ctx,bodyX+2*s,bodyY+8*s,9*s,s,G4.mFurH);
  px(ctx,bodyX+3*s,bodyY+9*s,7*s,2*s,G4.mBelly);
  const nTop=headY+7*s;
  const nBot=bodyY+8*s;
  if(nBot>nTop){
    px(ctx,bodyX+5*s,nTop,3*s,nBot-nTop,G4.mFur);
    px(ctx,bodyX+5*s,nTop,3*s,s,G4.mFurH);
  }
  px(ctx,headX+2*s,headY+1*s,9*s,6*s,G4.mFur);
  px(ctx,headX+3*s,headY,7*s,s,G4.mFur);
  px(ctx,headX+3*s,headY+7*s,7*s,s,G4.mFur);
  px(ctx,headX+s,headY+2*s,2*s,4*s,G4.mFur);
  px(ctx,headX+10*s,headY+2*s,2*s,4*s,G4.mFur);

function drawTop(){
  const ctx=topCtx, W=SW, H=SH;
  ctx.clearRect(0,0,W,H);
  const mActive=G.mode==='monkey';
  drawJungle(ctx,W,H,0);
  px(ctx,0,H-12,W,12,JNG.gnd);px(ctx,0,H-12,W,2,JNG.gndH);

  if(!paused && G.mode!=='setup'){
    const t=fmt(G.monkeySec);
    const pad=3;
    ctx.font=`bold ${UI_TIMER_FS}px 'Courier New'`;
    const tw=Math.ceil(ctx.measureText(t).width);
    const bx=W-tw-pad*2-4, by=4;
    const bh=UI_TIMER_FS+8;
    ctx.globalAlpha=0.85;px(ctx,bx,by,tw+pad*2,bh,G4.g3);ctx.globalAlpha=1;
    ctx.fillStyle=G4.g0;ctx.textAlign='left';ctx.fillText(t,bx+pad,by+bh-4);
  }

  const ps=peelS();
  G.peels.filter(p=>p.phase==='A'&&p.gy<H).forEach(p=>{
    const wob=Math.round(Math.sin((p.gy+p.gx)*0.05)*ps*0.6);
    ctx.globalAlpha=0.9;
    drawPeel(ctx,Math.round(p.gx+wob),Math.round(p.gy),ps);
    ctx.globalAlpha=1;
  });

  const ms=monkeyS(), mfr=Math.floor(G.fc/7)%2;
  const mMode=mActive?'eat':'chase';

  if(G.mode==='setup'){
    const iMode = G.likeAnim>0 ? 'chase' : (G.idleMode==='sleep'?'rest': G.idleMode==='sit'?'rest':'chase');
    const iJump = G.likeAnim>0 ? Math.round(Math.sin(G.likeAnim*8)*ms*5) : (G.idleMode==='walk'?Math.round(Math.sin(G.fc*0.25)*ms*1.5):0);
    drawMonkey(ctx,Math.round(G.idleX),H-12-14*ms,ms,iMode,mfr,iJump);
    G.hearts.forEach(h=>{
      ctx.globalAlpha=Math.max(0,h.a);
      ctx.font=`${Math.max(10,Math.floor(ms*3))}px sans-serif`;
      ctx.textAlign='center';
      ctx.fillText('❤️',Math.round(h.x),Math.round(h.y));
      ctx.textAlign='left';
      ctx.globalAlpha=1;
    });
    return;
  }

  if(paused){
    const travelX=Math.max(0,W-ms*14);
    const travelY=Math.max(0,H-12-14*ms);
    const speed=0.12;
    const t=(G.pauseDance*speed);
    const seg=Math.floor(t)%4;
    const u=t-Math.floor(t);
    const lerp=(a,b,p)=>a+(b-a)*p;
    const pad=ms*2;
    let x=0,y=0;
    if(seg===0){ x=lerp(pad,travelX-pad,u); y=pad; }
    else if(seg===1){ x=travelX-pad; y=lerp(pad,travelY-pad,u); }
    else if(seg===2){ x=lerp(travelX-pad,pad,u); y=travelY-pad; }
    else { x=pad; y=lerp(travelY-pad,pad,u); }
    x=Math.round(x); y=Math.round(y);
    const hop=Math.sin(G.pauseDance*4.2)*ms*4 + Math.sin(G.pauseDance*1.8)*ms*1;
    drawMonkey(ctx,x,y,ms,'chase',mfr,Math.round(hop));
  } else {
    drawMonkey(ctx,Math.round(G.monkeyX),H-12-14*ms,ms,mMode,mfr,Math.round(G.monkeyJump));
  }

  if(G.cheerMsgVisible && !mActive && G.mode==='work' && !paused){
    const mx2=Math.round(G.monkeyX);
    const fs=Math.max(10,Math.floor(W/18));
    const lineH=fs+5;
    const words=G.cheerMsg.split(' ');
    let line1='',line2='';
    words.forEach(w=>{if((line1+' '+w).trim().length<=13)line1=(line1+' '+w).trim();else line2=(line2+' '+w).trim();});
    const lines=line2?[line1,line2]:[line1];
    const bh=lines.length*lineH+16;
    ctx.font=`bold ${fs}px 'Courier New'`;
    const maxTW=Math.max(...lines.map(ln=>ctx.measureText(ln).width));
    const bw=Math.min(Math.ceil(maxTW)+20,W-10);
    const bx=Math.max(2,Math.min(mx2+ms*2,W-bw-4));
    const by=Math.max(4,H-12-14*ms-bh-ms*2);
    const fade=Math.min(1,G.cheerMsgTimer);
    ctx.globalAlpha=fade;
    px(ctx,bx+2,by+2,bw,bh,G4.g3);
    px(ctx,bx,by,bw,bh,G4.g0);
    px(ctx,bx,by,bw,2,G4.g2);px(ctx,bx,by+bh-2,bw,2,G4.g2);
    px(ctx,bx,by,2,bh,G4.g2);px(ctx,bx+bw-2,by,2,bh,G4.g2);
    px(ctx,bx+4,by+bh,4,4,G4.g0);
    ctx.fillStyle=G4.g3;
    ctx.textAlign='center';
    lines.forEach((ln,i)=>{ctx.fillText(ln,bx+bw/2,by+8+fs+(i*lineH));});
    ctx.textAlign='left';
    ctx.globalAlpha=1;
  }

  if(G.monkeyMsgVisible && mActive && !paused){
    const mx2=Math.round(G.monkeyX);
    const fs=Math.max(9,Math.floor(W/19));
    const lineH=fs+5;
    const lines=G.monkeyMsg.split('\n');
    ctx.font=`bold ${fs}px 'Courier New'`;
    const maxTW=Math.max(...lines.map(l=>ctx.measureText(l).width));
    const bw=Math.min(Math.ceil(maxTW)+20,W-8);
    const bh=lines.length*lineH+14;
    let bx=mx2+ms*14+4;
    if(bx+bw>W-4) bx=mx2-bw-4;
    bx=Math.max(2,bx);
    const by=Math.max(4,H-12-14*ms-bh-ms);
    const fade=Math.min(1,G.monkeyMsgTimer);
    ctx.globalAlpha=fade;
    px(ctx,bx+2,by+2,bw,bh,G4.g3);
    px(ctx,bx,by,bw,bh,'#1a1400');
    px(ctx,bx,by,bw,2,'#c8a800');px(ctx,bx,by+bh-2,bw,2,'#c8a800');
    px(ctx,bx,by,2,bh,'#c8a800');px(ctx,bx+bw-2,by,2,bh,'#c8a800');
    const tailX=mx2+ms*13 > bx ? bx : bx+bw;
    px(ctx,tailX>bx?bx:bx+bw-5,by+Math.floor(bh/2),5,4,'#1a1400');
    ctx.fillStyle='#f0d020';
    ctx.font=`bold ${fs}px 'Courier New'`;
    ctx.textAlign='center';
    lines.forEach((ln,i)=>ctx.fillText(ln,bx+bw/2,by+8+fs+i*lineH));
    ctx.textAlign='left';
    ctx.globalAlpha=1;
  }

  if(paused){
    ctx.fillStyle='rgba(0,10,5,0.72)';ctx.fillRect(0,0,W,H);
    const now=new Date();
    const hh=now.getHours().toString().padStart(2,'0');
    const mm=now.getMinutes().toString().padStart(2,'0');
    const ss=now.getSeconds().toString().padStart(2,'0');
    const ds=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
    const fs=Math.max(18,Math.floor(W/9));
    ctx.fillStyle=G4.g1;
    ctx.font=`bold ${Math.max(8,Math.floor(H/22))}px 'Courier New'`;
    ctx.textAlign='center';
    ctx.fillText('⏸  PAUSED',W/2,H*0.16);
    ctx.fillStyle=G4.g0;
    ctx.font=`bold ${fs}px 'Courier New'`;
    ctx.fillText(`${hh}:${mm}:${ss}`,W/2,H*0.52);
    ctx.fillStyle=G4.g1;
    ctx.font=`bold ${Math.max(8,Math.floor(fs*.55))}px 'Courier New'`;
    ctx.fillText(ds,W/2,H*0.70);
    ctx.fillStyle=G4.g2;
    ctx.font=`${Math.max(7,Math.floor(H/28))}px 'Courier New'`;
    ctx.fillText('TAP PAUSE TO RESUME',W/2,H*0.87);
    ctx.textAlign='left';
  }

  if(G.leaves){
    G.leaves.forEach(l=>{
      ctx.save();
      ctx.translate(Math.round(l.x),Math.round(l.y));
      ctx.rotate(l.rot);
      const fade=Math.min(1,Math.min(l.age, 8-l.age)*0.8);
      ctx.globalAlpha=fade*0.85;
      ctx.fillStyle=l.col;
      ctx.fillRect(-l.size,0,l.size*2,1);
      ctx.fillRect(-Math.floor(l.size*0.6),-1,Math.floor(l.size*1.2),3);
      ctx.globalAlpha=1;
      ctx.restore();
    });
  }

  if(G.bugs){
    G.bugs.forEach(b=>{
      const fade=Math.min(1,Math.min(b.age,b.life-b.age)*1.2);
      ctx.globalAlpha=fade*0.9;
      px(ctx,Math.round(b.x),Math.round(b.y),2,2,b.col);
      ctx.globalAlpha=fade*0.25;
      px(ctx,Math.round(b.x)-1,Math.round(b.y)-1,4,4,b.col);
      ctx.globalAlpha=1;
    });
  }

  if(G.castleFlash>0){ctx.globalAlpha=G.castleFlash*.3;ctx.fillStyle=G4.g0;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

  if(!paused){
    ctx.fillStyle=mActive?G4.g1:G4.g2;
    const _lfsM=Math.max(13,Math.floor(H/14));
    ctx.font=`bold ${_lfsM}px 'Courier New'`;
    const _lyM=Math.max(_lfsM+2,Math.floor(H/13)+2);
    ctx.fillText('MONKEY',5,_lyM);
    if(!mActive){ctx.globalAlpha=0.15;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  }
}

// ──────────────────────────────────────────────────────────────
//  BOTTOM SCREEN
// ──────────────────────────────────────────────────────────────
function drawBot(){
  const ctx=botCtx, W=SW, H=SH;
  ctx.clearRect(0,0,W,H);
  const wActive=G.mode==='work';
  drawCity(ctx,W,H,0);

  {
    const maxCastles=Math.max(1,G.castleList.length);
    const maxAreaW=Math.floor(W*0.46);
    const csRaw=Math.max(1,Math.floor(SH/65));
    const ciWRaw=12*csRaw+2;
    const cs=(ciWRaw*maxCastles<=maxAreaW)?csRaw:Math.max(1,Math.floor(maxAreaW/(maxCastles*13)));
    const ciW=12*cs+2;
    const ciY=groundY()-12*cs;
    G.castleList.forEach((c,i)=>{
      const cx=3+i*ciW;
      drawCastleIcon(ctx,cx,ciY,cs,c.corrupt);
    });
  }
  if(G.castleFlash>0){ctx.globalAlpha=G.castleFlash*.35;ctx.fillStyle=G4.g0;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

  const bW=brickW(),bX=brickX(),bUW=brickUW();
  const rH=rowH(),bH=Math.max(4,rH-1);
  for(let i=0;i<G.rows;i++){
    const ry=groundY()-(i+1)*rH;
    const bad=G.corruption>0.35&&i<Math.ceil(G.rows*G.corruption*.6);
    px(ctx,bX,ry,bW,rH-1,bad?G4.brkBad:G4.brkA);
    px(ctx,bX,ry,bW,2,bad?G4.brkBadB:G4.brkB);
    px(ctx,bX,ry+rH-3,bW,2,bad?G4.brkBad:G4.brkShd);
    px(ctx,bX,ry,2,rH-1,bad?G4.brkBadB:G4.brkB);
    px(ctx,bX+bW-3,ry,3,rH-1,bad?G4.brkBad:G4.brkLit);
    px(ctx,bX,ry+rH-1,bW,1,G4.brkMort);
    for(let j=1;j<6;j++)px(ctx,bX+j*bUW,ry,1,rH-1,G4.brkMort);
  }
  const crY=groundY()-G.rows*rH-bH-1;
  for(let i=0;i<G.bricks;i++){
    const bx2=bX+i*bUW;
    const bw2=bUW-1;
    px(ctx,bx2,crY,bw2,bH,G4.brkA);
    px(ctx,bx2,crY,bw2,2,G4.brkB);
    px(ctx,bx2,crY+bH-2,bw2,2,G4.brkShd);
    px(ctx,bx2,crY,2,bH,G4.brkB);
    px(ctx,bx2+bw2-3,crY,3,bH,G4.brkLit);
    if(i>0) px(ctx,bx2,crY,1,bH,G4.brkMort);
  }
  if(G.brickPartW>1&&G.bricks<6){
    const bx2=bX+G.bricks*bUW;
    px(ctx,bx2,crY,G.brickPartW,bH,G4.brkA);
    px(ctx,bx2,crY,G.brickPartW,2,G4.brkB);
  }
  if(G.brickFlash>0){ctx.globalAlpha=G.brickFlash*.5;px(ctx,bX+Math.max(0,G.bricks-1)*bUW,crY,bUW,bH,G4.g0);ctx.globalAlpha=1;}
  if(G.rowFlash>0){ctx.globalAlpha=G.rowFlash*.4;px(ctx,bX-2,groundY()-G.rows*rH-2,bW+4,rH+2,G4.g1);ctx.globalAlpha=1;}

  if(G.rows>0||G.bricks>0){
    const buildTop=groundY()-G.rows*rH-(G.bricks>0?bH+1:0);
    const buildH=groundY()-buildTop;
    ctx.globalAlpha=0.28;
    px(ctx,bX,buildTop,6,buildH,'#1a1810');
    px(ctx,bX+bW-8,buildTop,4,buildH,'#c8a860');
    ctx.globalAlpha=0.15;
    px(ctx,bX+bW-14,buildTop,6,buildH,'#c8a860');
    ctx.globalAlpha=1;
  }

  if(G.rows>0||G.bricks>0){
    ctx.globalAlpha=0.35;
    px(ctx,bX+4,groundY()-2,bW-8,3,'#0a0a08');
    ctx.globalAlpha=0.18;
    px(ctx,bX+2,groundY()-1,bW-4,2,'#0a0a08');
    ctx.globalAlpha=1;
  }

  const crX=bX+bW+10, bTop=groundY()-G.rows*rH, cTop=Math.max(4,bTop-20);
  const crH=groundY()-cTop;
  px(ctx,crX,cTop,4,crH,'#4a5040');
  px(ctx,crX,cTop,2,crH,'#6a7060');
  px(ctx,crX+3,cTop,1,crH,'#2a2e28');
  for(let ly=cTop+4;ly<groundY()-4;ly+=8){ px(ctx,crX,ly,4,1,'#3a3e38'); }
  const jibL=28, jibY=cTop;
  px(ctx,crX-jibL,jibY,jibL+4,3,'#4a5040');
  px(ctx,crX-jibL,jibY,jibL+4,1,'#6a7060');
  px(ctx,crX-jibL,jibY+2,jibL+4,1,'#2a2e28');
  px(ctx,crX+4,jibY,10,3,'#4a5040');
  px(ctx,crX+4,jibY,10,1,'#6a7060');
  px(ctx,crX-2,jibY+3,7,6,'#3a4a38');
  px(ctx,crX-1,jibY+4,5,2,'#6a8868');
  for(let s=0;s<jibL;s+=2){ const sx=crX-s, sy=jibY+3+Math.floor(s*0.25); px(ctx,sx,sy,1,1,'#3a4038'); }
  for(let s=0;s<8;s+=2){ const sx=crX+4+s, sy=jibY+3+Math.floor(s*0.25); px(ctx,sx,sy,1,1,'#3a4038'); }
  const hookAnchorX=crX-Math.floor(jibL*0.55);
  const cableLen=Math.min(cTop+Math.floor(crH*0.6), bTop-2)-jibY;
  px(ctx,hookAnchorX,jibY+3,1,Math.max(0,cableLen),'#2a2a28');
  px(ctx,hookAnchorX-2,jibY,5,3,'#5a6058');
  if(wActive&&G.rows<10){
    const hy=jibY+3+Math.max(0,cableLen);
    px(ctx,hookAnchorX-1,hy,3,2,'#3a3a38');
    const loadCol=G.brickFlash>0.5?G4.brkB:G4.brkA;
    px(ctx,hookAnchorX-5,hy+2,10,5,loadCol);
    px(ctx,hookAnchorX-5,hy+2,10,2,G4.brkB);
    px(ctx,hookAnchorX-5,hy+2,2,5,G4.brkB);
    px(ctx,hookAnchorX+3,hy+2,2,5,G4.brkLit);
  }
  const wlOn=(G.fc%30)<15;
  px(ctx,crX,cTop-3,4,3,wlOn?'#e04020':'#601808');

  const ps=peelS();
  G.peels.filter(p=>p.phase==='A'&&p.gy>=SH).forEach(p=>{
    const wob=Math.round(Math.sin((p.gy+p.gx)*0.05)*ps*0.6);
    ctx.globalAlpha=0.95;
    drawPeel(ctx,Math.round(p.gx+wob),Math.round(p.gy-SH),ps);
    ctx.globalAlpha=1;
  });
  G.peels.filter(p=>p.phase==='B').forEach(p=>drawPeel(ctx,p.x,Math.round(p.fy),ps));

  const gY=groundY();
  px(ctx,0,gY,W,4,'#1a1a28');
  px(ctx,0,gY,W,1,'#282838');
  px(ctx,0,gY+4,W,SH-gY-4,'#0e0e18');
  ctx.globalAlpha=0.10;
  px(ctx,0,gY-3,W,4,'#3040a0');
  ctx.globalAlpha=1;

  const ws=workerS(),wfr=Math.floor(G.fc/8)%2;
  const wx=Math.round(G.workerX)-6*ws,wy=groundY()-20*ws;
  const wMode=(wActive&&G.hammerFlash>0)?'hammer':G.workerMode;
  drawWorker(ctx,wx,wy,ws,wMode,wfr);

  if(G.workerMsgVisible && !paused && (G.mode==='work'||G.mode==='monkey')){
    const fs=Math.max(9,Math.floor(W/20));
    const lineH=fs+4;
    const lines=G.workerMsg.split('\n');
    ctx.font=`bold ${fs}px 'Courier New'`;
    const maxTW=Math.max(...lines.map(l=>ctx.measureText(l).width));
    const bw=Math.ceil(maxTW)+18;
    const bh=lines.length*lineH+14;
    const wbx=Math.round(G.workerX)-6*ws;
    let bubX=wbx-Math.floor(bw/2)+6*ws;
    if(bubX+bw>W-4) bubX=W-bw-4;
    if(bubX<2) bubX=2;
    const bubY=wy-bh-4;
    const fade=Math.min(1,G.workerMsgTimer);
    ctx.globalAlpha=fade;
    px(ctx,bubX+2,bubY+2,bw,bh,G4.g3);
    const bubBg=G.mode==='monkey'?'#0a1828':'#0a2018';
    const bubBorder=G.mode==='monkey'?'#1a3848':'#1a4828';
    px(ctx,bubX,bubY,bw,bh,bubBg);
    px(ctx,bubX,bubY,bw,2,bubBorder);
    px(ctx,bubX,bubY+bh-2,bw,2,bubBorder);
    px(ctx,bubX,bubY,2,bh,bubBorder);
    px(ctx,bubX+bw-2,bubY,2,bh,bubBorder);
    const tailX=Math.max(bubX+6,Math.min(bubX+bw-10,wbx+6*ws));
    px(ctx,tailX,bubY+bh,4,4,bubBg);
    px(ctx,tailX+1,bubY+bh+4,2,2,bubBg);
    ctx.fillStyle=G.mode==='monkey'?'#88c8e8':G4.g1;
    ctx.font=`bold ${fs}px 'Courier New'`;
    ctx.textAlign='center';
    lines.forEach((ln,i)=>ctx.fillText(ln,bubX+bw/2,bubY+8+fs+i*lineH));
    ctx.textAlign='left';
    ctx.globalAlpha=1;
  }

  if(G.mode==='monkey'){
    G.zz.forEach(z=>{
      ctx.globalAlpha=Math.max(0,z.a);ctx.fillStyle=G4.g1;
      ctx.font=`bold ${Math.max(9,ws*3)}px 'Courier New'`;
      ctx.fillText('z',z.x,z.y);ctx.globalAlpha=1;
    });
  }

  const dirty=G.peels.filter(p=>p.phase==='B').length;
  if(dirty>0&&wActive&&!paused){
    px(ctx,0,H-14,W,14,G4.g3);
    ctx.fillStyle=G4.banana;
    ctx.font=`bold ${Math.max(8,Math.floor(H/22))}px 'Courier New'`;
    ctx.fillText(`🍌 CLEAN x${dirty}`,5,H-3);
  }

  if(paused){
    ctx.fillStyle='rgba(0,5,10,0.75)';ctx.fillRect(0,0,W,H);
    const now=new Date();
    const today=now.getDate(),month=now.getMonth(),year=now.getFullYear();
    const mName=now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
    const firstDay=new Date(year,month,1).getDay();
    const daysInMonth=new Date(year,month+1,0).getDate();
    const hdrH=Math.max(9,Math.floor(H/22));
    ctx.fillStyle=G4.g0;ctx.font=`bold ${hdrH}px 'Courier New'`;ctx.textAlign='center';
    ctx.fillText(mName,W/2,hdrH+4);
    const days=['Su','Mo','Tu','We','Th','Fr','Sa'];
    const padX=6, padB=10;
    const gridTop=hdrH*2+18;
    const cellW=Math.floor((W-padX*2)/7);
    const startX=Math.floor((W-cellW*7)/2);
    const cellH=Math.max(12,Math.floor((H-gridTop-padB)/6.6));
    const hY=gridTop;
    const sf=Math.max(6,Math.floor(cellH*0.52));
    ctx.fillStyle=G4.g2;ctx.font=`bold ${sf}px 'Courier New'`;
    days.forEach((d,i)=>ctx.fillText(d,startX+i*cellW+Math.floor(cellW/2),hY));
    let dn=1;
    for(let row=0;row<6&&dn<=daysInMonth;row++){
      for(let col=0;col<7&&dn<=daysInMonth;col++){
        if(row===0&&col<firstDay)continue;
        const cx=startX+col*cellW;
        const cy=hY+10+row*cellH;
        const isT=dn===today;
        if(isT){
          ctx.fillStyle=G4.g1;
          ctx.fillRect(cx+1,cy+1,cellW-2,cellH-2);
          ctx.fillStyle=G4.g3;
        } else {
          ctx.fillStyle=G4.g0;
        }
        ctx.font=`bold ${sf}px 'Courier New'`;
        ctx.textBaseline='middle';
        ctx.fillText(dn.toString(),cx+Math.floor(cellW/2),cy+Math.floor(cellH/2));
        ctx.textBaseline='alphabetic';
        dn++;
      }
    }
    ctx.textAlign='left';
  }

  if(!paused){
    const t=fmt(G.workSec);
    const pad=3;
    ctx.font=`bold ${UI_TIMER_FS}px 'Courier New'`;
    const tw=Math.ceil(ctx.measureText(t).width);
    const bx=W-tw-pad*2-4, by=4;
    const bh=UI_TIMER_FS+8;
    ctx.globalAlpha=0.85;px(ctx,bx,by,tw+pad*2,bh,G4.g3);ctx.globalAlpha=1;
    ctx.fillStyle=G4.g0;ctx.textAlign='left';ctx.fillText(t,bx+pad,by+bh-4);

    ctx.fillStyle=wActive?G4.g1:G4.g2;
    const _lfsW=Math.max(13,Math.floor(H/14));
    ctx.font=`bold ${_lfsW}px 'Courier New'`;
    const _lyW=Math.max(_lfsW+2,Math.floor(H/13)+2);
    ctx.fillText('WORK',5,_lyW);
    if(!wActive){ctx.globalAlpha=0.15;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
  }
}

// ──────────────────────────────────────────────────────────────
//  MAIN LOOP
// ──────────────────────────────────────────────────────────────
let lastTs=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTs)/1000,0.1);lastTs=ts;
  if(G.mode==='ended')return;

  if(paused){
    G.pauseDance+=dt*1.8;
    drawTop();drawBot();return;
  }

  G.fc++;
  G.brickFlash=Math.max(0,G.brickFlash-dt*3);

  if(G.mode==='setup'){
    const ms2=monkeyS();
    const el=document.getElementById('total-badge');
    if(el) el.textContent=`⏳ ${fmtRemain(G.targetSec)}`;
    G.hearts.forEach(h=>{h.y-=55*dt;h.a-=dt*0.55;});
    G.hearts=G.hearts.filter(h=>h.a>0);
    if(G.likeAnim>0){ G.likeAnim=Math.max(0,G.likeAnim-dt); G.idleMode='walk'; }
    G.idleTimer-=dt;
    if(G.idleTimer<=0){
      const r=Math.random();
      if(r<0.45){ G.idleMode='walk'; G.idleTargetX=Math.floor(ms2*2+Math.random()*(SW-ms2*16)); G.idleTimer=1.8+Math.random()*2.5; }
      else if(r<0.70){ G.idleMode='sit'; G.idleTimer=1.2+Math.random()*2.0; }
      else { G.idleMode='sleep'; G.idleTimer=2.0+Math.random()*3.0; }
    }
    if(G.idleMode==='walk'){
      const spd=ms2*30;
      const dx=G.idleTargetX-G.idleX;
      if(Math.abs(dx)>spd*dt){ G.idleX+=Math.sign(dx)*spd*dt; }
      else { G.idleX=G.idleTargetX; G.idleMode='sit'; G.idleTimer=0.8+Math.random()*1.5; }
    }
    G.idleX=Math.max(ms2*2,Math.min(SW-ms2*15,G.idleX));
    drawTop();drawBot();
    return;
  }

  G.rowFlash=Math.max(0,G.rowFlash-dt*2);
  G.castleFlash=Math.max(0,G.castleFlash-dt*1.5);
  G.hammerFlash=Math.max(0,G.hammerFlash-dt*2.5);

  G.workerX+=(G.workerTargetX-G.workerX)*Math.min(1,dt*7);
  G.monkeyX+=(G.monkeyTargetX-G.monkeyX)*Math.min(1,dt*3.5);
  if(G.mode==='work'){
    G.monkeyBounceT+=dt;
    if(G.monkeyBounceT>0.42){G.monkeyBounceT=0;G.monkeyJumpV=-monkeyS()*6;}
    G.monkeyJumpV+=monkeyS()*30*dt;
    G.monkeyJump+=G.monkeyJumpV*dt;
    if(G.monkeyJump>0){G.monkeyJump=0;G.monkeyJumpV=0;}
  } else {
    G.monkeyJump=0;G.monkeyJumpV=0;G.monkeyBounceT=0;
  }

  const ps=peelS();
  G.peels.forEach(p=>{
    if(p.phase==='A'){
      p.vy+=p.grav*dt; p.gx+=p.vx*dt; p.gy+=p.vy*dt;
      if(p.gx<2){p.gx=2;p.vx=Math.abs(p.vx)*0.85;}
      if(p.gx>SW-10){p.gx=SW-10;p.vx=-Math.abs(p.vx)*0.85;}
      if(p.gy>=SH+p.landY){ p.phase='B'; p.x=Math.round(Math.max(2,Math.min(SW-ps*12-2,p.gx))); p.fy=p.landY; }
    }
    else if(p.phase==='B'){if(p.fy<p.landY)p.fy=Math.min(p.landY,p.fy+p.spd*dt);}
  });
  G.peels=G.peels.filter(p=>p.phase!=='D');

  if(G.mode==='monkey'){
    const cycle=9.6;
    G.eatCycleT+=dt;
    if(G.eatCycleT>=cycle){ G.eatCycleT-=cycle; spawnPeel(); }
    G.bananaEat=G.eatCycleT/cycle;
  } else { G.bananaEat=0; G.eatCycleT=0; }

  if(G.mode==='monkey'){
    G.monkeySec+=dt;
    G.zzTimer+=dt;
    if(G.zzTimer>1.6){
      G.zzTimer=0;
      const ws=workerS();G.zz.push({x:Math.round(G.workerX)+ws*4,y:groundY()-ws*12,a:1,vy:-22});
    }
    G.zz.forEach(z=>{z.y+=z.vy*dt;z.a-=dt*.55;});G.zz=G.zz.filter(z=>z.a>0);
    G.workerMode='rest';G.workerTargetX=SW*0.20;
    G.monkeyTargetX=SW*0.55;
  }

  if(G.mode==='work'){
    G.workSec+=dt;
    const dirtyIdx=G.peels.findIndex(p=>p.phase==='B'&&p.fy>=p.landY);
    if(dirtyIdx>=0){
      const p=G.peels[dirtyIdx];
      G.workerMode='sweep';G.hammerFlash=0;
      G.workerTargetX=Math.min(SW*.88,Math.max(SW*.05,p.x+10));
      p.cleanT=(p.cleanT||0)+dt;
      if(p.cleanT>=4){p.phase='D';G.trashCount++;snd('sweep');}
    } else {
      G.workerMode='work';
      const nB=G.bricks;
      const tBX=brickX()+nB*brickUW()+Math.floor(brickUW()/2);
      G.workerTargetX=Math.min(SW*.90,tBX+workerS()*2);
      G.brickTimer+=dt;
      G.brickPartW=Math.floor((G.brickTimer/10)*brickUW());
      if(G.brickTimer>=10){
        G.brickTimer-=10;G.bricks++;G.brickPartW=0;
        G.brickFlash=1;G.hammerFlash=1;snd('brick');
        if(G.bricks>=6){
          G.bricks=0;G.rows++;G.rowFlash=1;snd('row');
          if(G.rows>=10){ G.rows=0;G.castles++;G.castleFlash=1;snd('castle'); G.castleList.push({corrupt:G.corruption}); }
        }
      }
      const tot=G.workSec+G.monkeySec;G.corruption=tot>0?G.monkeySec/tot:0;
    }

    G.monkeyWanderT-=dt;
    if(G.monkeyWanderT<=0){
      const r=Math.random();
      if(r<0.55){ G.monkeyTargetX=Math.floor(monkeyS()*2+Math.random()*(SW-monkeyS()*16)); G.monkeyWanderT=2.0+Math.random()*3.0; }
      else if(r<0.75){ G.monkeyTargetX=G.monkeyX; G.monkeyWanderT=0.8+Math.random()*1.5; }
      else { G.monkeyJumpV=-monkeyS()*5; G.monkeyWanderT=1.5+Math.random()*2.5; }
    }
    G.monkeyJumpV+=monkeyS()*28*dt;
    G.monkeyJump+=G.monkeyJumpV*dt;
    if(G.monkeyJump>0){G.monkeyJump=0;G.monkeyJumpV=0;}
    G.monkeyTargetX=Math.max(0,Math.min(SW-monkeyS()*14,G.monkeyTargetX));
  }

  document.getElementById('total-badge').textContent=`⏳ ${fmtRemain(Math.max(0,G.targetSec-(G.workSec+G.monkeySec)))}`;

  if(G.mode==='work'||G.mode==='monkey'){
    G.workerMsgTimer=Math.max(0,(G.workerMsgTimer||0)-dt);
    G.workerSpeechT=Math.max(0,(G.workerSpeechT||0)-dt);
    if(G.workerMsgTimer<=0) G.workerMsgVisible=false;
    if(G.workerSpeechT<=0){
      const pool=(G.mode==='monkey')?WORKER_SLEEP:WORKER_WORK;
      G.workerMsg=pool[Math.floor(Math.random()*pool.length)];
      G.workerMsgTimer=4.5; G.workerMsgVisible=true; G.workerSpeechT=9+Math.random()*9;
    }
  }
  if(G.mode==='work'){
    G.cheerMsgTimer=Math.max(0,(G.cheerMsgTimer||0)-dt);
    G.cheerSpeechT=Math.max(0,(G.cheerSpeechT||0)-dt);
    if(G.cheerMsgTimer<=0) G.cheerMsgVisible=false;
    if(G.cheerSpeechT<=0){
      G.cheerMsg=CHEERS[Math.floor(Math.random()*CHEERS.length)];
      G.cheerMsgTimer=4.0; G.cheerMsgVisible=true; G.cheerSpeechT=8+Math.random()*10;
    }
    G.monkeyMsgVisible=false;
  } else if(G.mode==='monkey'){
    G.monkeyMsgTimer=Math.max(0,(G.monkeyMsgTimer||0)-dt);
    G.monkeySpeechT=Math.max(0,(G.monkeySpeechT||0)-dt);
    if(G.monkeyMsgTimer<=0) G.monkeyMsgVisible=false;
    if(G.monkeySpeechT<=0){
      G.monkeyMsg=MONKEY_FACTS[Math.floor(Math.random()*MONKEY_FACTS.length)];
      G.monkeyMsgTimer=5.0; G.monkeyMsgVisible=true; G.monkeySpeechT=9+Math.random()*9;
    }
    G.cheerMsgVisible=false;
  } else {
    G.cheerMsgVisible=false;
    G.monkeyMsgVisible=false;
  }

  // Leaves and bugs spawn in all active modes (work/monkey/setup)
  if(G.mode!=='ended'){
    G.leafSpawnT-=dt;
    if(G.leafSpawnT<=0){
      G.leafSpawnT=0.6+Math.random()*1.5;
      G.leaves.push({ x:Math.random()*SW, y:-4, vx:(Math.random()-0.5)*18, vy:12+Math.random()*10, rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*2.0, col:['#2a6828','#286030','#1e5020','#3a8838','#347040'][Math.floor(Math.random()*5)], size:Math.max(2,Math.floor(Math.random()*4)+2), age:0 });
    }
    G.bugSpawnT-=dt;
    if(G.bugSpawnT<=0){
      G.bugSpawnT=2+Math.random()*4;
      G.bugs.push({ x:Math.random()*SW, y:SH*0.15+Math.random()*SH*0.55, vx:(Math.random()-0.5)*30, vy:(Math.random()-0.5)*20, age:0, life:4+Math.random()*5, col:Math.random()<0.5?'#88ff44':'#ffdd44' });
    }
  }
  G.leaves.forEach(l=>{ l.vx+=Math.sin(G.fc*0.04+l.x*0.02)*0.8*dt; l.x+=l.vx*dt; l.y+=l.vy*dt; l.rot+=l.rotV*dt; l.age+=dt; });
  G.leaves=G.leaves.filter(l=>l.y<SH+10&&l.age<8);
  G.bugs.forEach(b=>{ b.vx+=(Math.random()-0.5)*20*dt; b.vy+=(Math.random()-0.5)*15*dt; b.vx=Math.max(-40,Math.min(40,b.vx)); b.vy=Math.max(-30,Math.min(30,b.vy)); b.x+=b.vx*dt; b.y+=b.vy*dt; b.age+=dt; });
  G.bugs=G.bugs.filter(b=>b.age<b.life&&b.x>-10&&b.x<SW+10);

  if(G.mode==='work'||G.mode==='monkey'){
    G.carSpawnT-=dt;
    if(G.carSpawnT<=0){
      G.carSpawnT=1.2+Math.random()*2.0;
      const isBike=Math.random()<0.3;
      const spd=isBike?(22+Math.random()*15):(10+Math.random()*10);
      const rtl=Math.random()<0.2;
      const cols=['#e03020','#2050d0','#d0c020','#20a030','#c06010','#a0a0b0','#ffffff'];
      G.cars.push({ x:rtl?SW+8:-8, spd:rtl?-spd:spd, isBike, col:cols[Math.floor(Math.random()*cols.length)] });
    }
    G.cars.forEach(c=>{ c.x+=c.spd*dt; });
    G.cars=G.cars.filter(c=>c.x>-20&&c.x<SW+20);
  }

  if((G.workSec+G.monkeySec)>=G.targetSec){endGame();return;}

  drawTop();drawBot();
}

function spawnPeel(){
  const ps=peelS();
  const ms=monkeyS();
  const startX=Math.round(G.monkeyX+11*ms);
  const startY=Math.round(SH-12-14*ms+4*ms);
  const landY=groundY()-ps*12-2;
  const vx=(Math.random()*2-1)*90;
  const vy=140+Math.random()*45;
  const grav=420+Math.random()*80;
  G.peels.push({ phase:'A', gx:startX, gy:startY, vx, vy, grav, landY, x:startX, fy:startY, spd:85+Math.random()*55, cleanT:0 });
  snd('peel');
}

function endGame(){
  G.mode='ended';
  const pur=Math.max(0,Math.floor((1-G.corruption)*100));
  const tot=G.workSec+G.monkeySec;const eff=tot>0?Math.floor(G.workSec/tot*100):0;
  let emoji,title,comment;
  if(pur>=90){emoji='🏰';title='CATHEDRAL!';comment='Perfect focus!\nThe monkey never won.';}
  else if(pur>=70){emoji='🏢';title='GREAT WORK!';comment='Strong effort.\nA few peels, but solid.';}
  else if(pur>=50){emoji='🏚️';title='BANANA HALL';comment='Half won by monkey.\nPush harder next time.';}
  else if(pur>=30){emoji='🍌';title='PEEL TOWER';comment='Mostly banana.\nClose to collapse.';}
  else{emoji='💀';title='COLLAPSE!';comment='Monkey total victory.\nGet back to work!';}
  document.getElementById('end-emoji').textContent=emoji;
  document.getElementById('end-title').textContent=title;
  document.getElementById('r-work').textContent=fmt(G.workSec);
  document.getElementById('r-monkey').textContent=fmt(G.monkeySec);
  document.getElementById('r-purity').textContent=pur+'%';
  document.getElementById('r-purity-bar').style.width=pur+'%';
  document.getElementById('r-purity-bar').style.background=pur>=70?'#44cc66':pur>=40?'#ccaa22':'#cc4422';
  document.getElementById('r-eff').textContent=eff+'%';
  document.getElementById('r-eff-bar').style.width=eff+'%';
  document.getElementById('r-castles').textContent=G.castles;
  document.getElementById('r-peels').textContent=G.trashCount;
  document.getElementById('r-comment').textContent=comment.replace('\n',' ');
  document.getElementById('end-ov').classList.remove('hidden');
  snd('win');drawTop();drawBot();
}

function fmt(s){return`${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;}
function fmtRemain(s){
  const v=Math.max(0,Math.ceil(s));
  return`${Math.floor(v/60).toString().padStart(2,'0')}:${Math.floor(v%60).toString().padStart(2,'0')}`;
}

G=newGame(selectedMin);
layout();
G.idleX=Math.floor(SW*0.5);
G.idleTargetX=Math.floor(SW*0.3);
window.addEventListener('resize',layout);
if(window.visualViewport) window.visualViewport.addEventListener('resize',layout);
requestAnimationFrame(loop);
</script>
